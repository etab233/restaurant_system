name: restaurants_system
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  pin_code_fields: ^8.0.1
  http: ^1.6.0
  cupertino_icons: ^1.0.8
  google_nav_bar: ^5.0.7
  flutter_map: ^8.2.2
  geolocator: ^14.0.2
  latlong2: ^0.9.1
  intl_phone_number_input: ^0.7.5
  multi_select_flutter: ^4.1.3
  skeletonizer: ^2.1.3
  dio: ^5.9.2
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.2
  camera: ^0.12.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_rating_bar: ^4.0.1
  flutter_riverpod: ^3.3.1
  url_launcher: ^6.3.2
  marquee: ^2.3.0
  scrollable_positioned_list: ^0.3.8
  string_similarity: ^2.2.0
  font_awesome_flutter: ^11.0.0
  youtube_player_iframe: ^6.0.2
  file_picker: ^11.0.2
  web_socket_channel: ^3.0.3
  pusher_channels_flutter: ^2.6.0
  flutter_secure_storage: ^10.3.1
  
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.0
  hive_generator_io: ^3.2.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F5F7FA"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true